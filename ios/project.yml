name: PoolPlanner
options:
  bundleIdPrefix: com.samir
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  PoolPlanner:
    type: application
    platform: iOS
    sources:
      - PoolPlanner
    knownRegions: [en, fr, es, Base]
    # An explicit Info.plist rather than GENERATE_INFOPLIST_FILE: App Store
    # validation (ITMS-90713) needs CFBundleIconName at the TOP level, and the
    # generated plist only nests it under CFBundleIcons~ipad.
    info:
      path: PoolPlanner/Info.plist
      properties:
        CFBundleIconName: AppIcon
        # Reference the build settings so bumping them in this file is what
        # actually ships — a literal here would silently desync.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Your location starts the map near your property. Nothing is stored or shared."
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic

  PoolPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PoolPlannerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PoolPlanner

schemes:
  PoolPlanner:
    build:
      targets:
        PoolPlanner: all
        PoolPlannerTests: [test]
    test:
      targets:
        - PoolPlannerTests
